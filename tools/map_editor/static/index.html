<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TW Map Editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="sidebar">
    <h1>Map Editor</h1>

    <div class="section-label">Layers</div>
    <div id="layerList"></div>

    <div id="tools"></div>

    <div class="section-label" id="featureLabel">Contents</div>
    <div id="featureList"></div>

    <div class="footer-actions">
      <button id="saveBtn">Save Draft</button>
      <button id="exportBtn" class="primary">Export Package</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="hint">
      Export writes the package to tools/map_editor/dev_map_data/.
      Run <b>make promote-map</b> to ship it to the game.
    </div>
    <div id="status"></div>
  </div>

  <div id="viewport">
    <div id="stage">
      <img id="bgImage">
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <script src="/static/trace.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
