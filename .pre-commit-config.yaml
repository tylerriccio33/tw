repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/tylerriccio33/slop-lint
    rev: 34685f635f22dbc17665e306a1dba4c8c07a8238
    hooks:
      - id: slop-lint

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run --with pyrefly --with pillow --with numpy --with scipy --with opencv-python-headless --with scikit-image --with pytest pyrefly check tools
        language: system
        files: \.py$
        pass_filenames: false

      - id: map-editor-tests
        name: map-editor tests (pytest)
        entry: bash -c 'cd tools/map_editor && uv run pytest -q'
        language: system
        files: ^tools/map_editor/.*\.py$
        pass_filenames: false

      - id: gdformat
        name: gdformat
        entry: uvx --from "gdtoolkit==4.5.0" gdformat
        language: system
        files: \.gd$

      - id: gdlint
        name: gdlint
        entry: uvx --from "gdtoolkit==4.5.0" gdlint
        language: system
        files: \.gd$

      - id: cargo-fmt
        name: cargo fmt (campaign)
        entry: cargo fmt --manifest-path rust/campaign/Cargo.toml
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (campaign)
        entry: cargo clippy --manifest-path rust/campaign/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test (campaign)
        entry: cargo test --manifest-path rust/campaign/Cargo.toml
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false

      - id: gut-test
        name: gut test (campaign GDScript)
        entry: make gut-test
        language: system
        files: ^(campaign|tests)/.*\.gd$
        pass_filenames: false

      - id: render-test
        name: render test (golden-image SSIM gate)
        entry: make render-test
        language: system
        files: ^(campaign/.*\.(gd|gdshader|tscn)|campaign/map_data/.*|assets/(armies|buildings)/.*|tools/(shoot\.gd|render_test\.py)|tests/golden/.*)$
        pass_filenames: false
