repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run --with pyrefly --with pillow --with numpy pyrefly check tools
        language: system
        files: \.py$
        pass_filenames: false

      - id: gdformat
        name: gdformat
        entry: uvx --from "gdtoolkit==4.5.0" gdformat
        language: system
        files: \.gd$

      - id: gdlint
        name: gdlint
        entry: uvx --from "gdtoolkit==4.5.0" gdlint
        language: system
        files: \.gd$

      - id: cargo-fmt
        name: cargo fmt (campaign)
        entry: cargo fmt --manifest-path rust/campaign/Cargo.toml
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (campaign)
        entry: cargo clippy --manifest-path rust/campaign/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test (campaign)
        entry: cargo test --manifest-path rust/campaign/Cargo.toml
        language: system
        files: ^rust/campaign/.*\.rs$
        pass_filenames: false
